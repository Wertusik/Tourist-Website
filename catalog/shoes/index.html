<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/catalog.css">
    <link rel="shortcut icon" href="../../img/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=block" rel="stylesheet">
    <title>I TRAVEL</title>
</head>
<body>
    <header class="header">
        <div class="header__wrapper">
            <nav class="header__nav">
                <a href="/" class="header__logo">
                    <img src="../../img/logotravel.png" alt="Логотип" class="header__logo-img">
                </a>
                <ul class="header__list">
                    <li class="header__list">
                       <a class="header__list-link" href="../../index.html">Главная</a>
                    </li>
                    <li class="header__list">
                       <a class="header__list-link" href="../../about.html">О нас</a>
                    </li>
                    <li class="header__list">
                        <a class="header__list-link active" href="../../catalog.html">Каталог</a>
                    </li>
                    <li class="header__list">
                        <a class="header__list-link" href="../../review.html">Отзывы</a>
                    </li>
                    <li class="header__list">
                        <a class="header__list-link" href="../../contacts.html">Контакты</a>
                    </li>
                </ul>
                <div class="header__right">
                    <a href="#overlay" class="header__cart-link">
                        <img src="../../img/login.png" alt="Войти" class="header__cart-img">
                        <span class="header__cart-text">Войти</span>
                    </a>
                    <a href="/" class="header__cart-link">
                        <img src="../../img/cart.png" alt="Корзина" class="header__cart-img">
                        <span class="header__cart-text">Корзина</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="catalog__wrapper">
                <h2 class="catalog__header">Обувь</h2>
                <div class="catalog__cards">
                    <a href="" class="catalog__card">
                        <img src="../../img/shoes_men.png" alt="Товар" class="catalog__img">
                        <p class="catalog__text">Мужская обувь</p>
                    </a>
                    <a href="" class="catalog__card">
                        <img src="../../img/shoes_women.png" alt="Товар" class="catalog__img">
                        <p class="catalog__text">Женская обувь</p>
                    </a>
                    <a href="" class="catalog__card">
                        <img src="../../img/shoes_kids.png" alt="Товар" class="catalog__img">
                        <p class="catalog__text">Детская обувь</p>
                    </a>
                </div>
            </div>
        </div>
    </main>
    <!-- Личный кабинет -->
    <div class="overlay" id="overlay">
        <div class="overlay__wrapper">
            <a href="#" class="overlay__close">
                <img src="../../img/close.png" alt="Закрыть" class="overlay__close-item">
            </a>
            <h2 class="overlay__title">Войти</h2>
            <form action="" class="overlay__content">
                <label for="" class="overlay__name">Ваш телефон</label>
                <input type="tel" class="overlay__phone" placeholder="+ 7 (___) ___-__-__"  required>
                <button class="overlay__button">Отправить</button>
                <p class="overlay__info">Нажимая кнопку «Войти», я принимаю условия пользовательского соглашения и подтверждаю, что ознакомился с условиями политики обработки персональных данных</p>
            </form>
        </div>
    </div>

</body>
</html>
