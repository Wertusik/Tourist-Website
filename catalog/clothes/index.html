<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/catalog.css">
    <link rel="shortcut icon" href="../../img/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=block" rel="stylesheet">
    <title>I TRAVEL</title>
</head>
<body>
    <header class="header">
        <div class="header__wrapper">
            <nav class="header__nav">
                <a href="/" class="header__logo">
                    <img src="../../img/logotravel.png" alt="Логотип" class="header__logo-img">
                </a>
                <ul class="header__list">
                    <li class="header__item">
                       <a class="header__list-link" href="../../index.html">Главная</a>
                    </li>
                    <li class="header__item">
                       <a class="header__list-link active" href="../../about.html">О нас</a>
                    </li>
                    <li class="header__item">
                        <a class="header__list-link" href="../../catalog.html">Каталог</a>
                    </li>
                    <li class="header__item">
                        <a class="header__list-link" href="../../review.html">Отзывы</a>
                    </li>
                    <li class="header__item">
                        <a class="header__list-link" href="../../contacts.html">Контакты</a>
                    </li>
                </ul>
                <div class="header__right">
                    <a href="../../profile.html" class="header__cart-link">
                        <img src="../../img/login.png" alt="Мой профиль" class="header__cart-img">
                        <span class="header__cart-text">Мой профиль</span>
                    </a>
                    <a href="../../cart.html" class="header__cart-link">
                        <img src="../../img/cart.png" alt="Корзина" class="header__cart-img">
                        <span class="header__cart-text">Корзина</span>
                    </a>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="catalog__wrapper">
                <h2 class="catalog__header">Одежда</h2>
                <div class="catalog__cards">
                    <a href="" class="catalog__card">
                        <img src="../../img/clothes_man.png" alt="Товар" class="catalog__img">
                        <p class="catalog__text">Мужская одежда</p>
                    </a>
                    <a href="" class="catalog__card">
                        <img src="../../img/clothes_woman.png" alt="Товар" class="catalog__img">
                        <p class="catalog__text">Женская одежда</p>
                    </a>
                    <a href="" class="catalog__card">
                        <img src="../../img/clothes_kid.png" alt="Товар" class="catalog__img">
                        <p class="catalog__text">Детская одежда</p>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
