<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I TRAVEL</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__wrapper">
            <nav class="header__nav">
                <img src="./img/logotravel.svg" alt="">
                <ul class="header__list">
                    <li>
                       <a class="header__list-link" href="/">О нас</a>
                    </li>
                    <li>
                        <a class="header__list-link" href="/">Каталог</a>
                    </li>
                    <li>
                        <a class="header__list-link" href="/">Отзывы</a>
                    </li>
                    <li>
                        <a class="header__list-link" href="/">Контакты</a>
                    </li>
                </ul>
                <div class="header__cart">
                    <a href="/">
                        <img src="./img/cart.png" alt="">
                    </a>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero__container">
                <div class="hero__img-left">
                    <a href="/">
                        <img src="./img/hero-left.jpg" alt="Хиты продаж">
                    </a>
                </div>
                <div class="hero__right-column">
                    <div class="hero__img-top">
                        <a href="/">
                            <img src="./img/hero-top.png" alt="">
                        </a>
                    </div>
                    <div class="hero__img-bottom">
                        <a href="/">
                            <img src="./img/hero-bottom.jpg" alt="">
                        </a>
                    </div>
                </div>
            </div>
            
        </section>
    </main>
    
</body>
</html>
