<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/cart.css">
    <link rel="shortcut icon" href="./img/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=block" rel="stylesheet">
    <title>I TRAVEL</title>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header__wrapper">
                <nav class="header__nav">
                    <a href="" class="header__logo">
                        <img src="./img/logotravel.png" alt="Логотип" class="header__logo-img">
                    </a>
                    <ul class="header__list">
                        <li class="header__item">
                            <a href="" class="header__link">
                                <span class="header__text">Войти</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main class="cart">
        <div class="container">
            <div class="cart__wrapper">
                <h2 class="cart__header">Корзина</h2>
                <div class="cart__cards">
                    <div class="cart__card">
                        <input type="checkbox" class="cart__card-tick">
                        <a href="" class="cart__link">
                            <img src="./img/FISHER Hybrid Black.jpg" alt="Товар" class="cart__card-img">
                        </a>
                        <div class="cart__name">
                            <p class="cart__size">#1834818</p>
                            <a href="" class="cart__link">
                                <span class="cart__card-text">Брюки беговые мужские FISCHER Hybrid Black</span>
                            </a>
                            <p class="cart__size">S</p>
                        </div>
                        <div class="cart__number">
                            <form action="" class="cart__number-main">
                                <a href="" class="cart__number-less">
                                    <img src="./img/minus.png" alt="-" class="cart__number-img">
                                </a>
                                <input type="text" class="cart__number-input" value="1" readonly>
                                <a href="" class="cart__number-more">
                                    <img src="./img/plus.png" alt="+" class="cart__number-img">
                                </a>
                            </form>
                            <p class="cart__number-price">11 200 ₽/шт.</p>
                        </div>
                        <span class="cart__price">22 400 ₽</span>
                        <div class="cart__backet">
                            <a href="" class="right__link">
                            <img src="./img/heart.png" alt="Иконка" class="cart__right-img">
                            </a>
                            <a href="" class="right__link">
                            <img src="./img/trash.png" alt="Иконка" class="cart__right-img">
                            </a>
                        </div>
                    </div>
                </div>
                <div class="cart__right">
                    <div class="cart__content">
                        <div class="cart__product">
                            <p class="cart__product-text">Товаров 5 на сумму</p>
                            <span class="cart__product-price">78 280 ₽</span>
                            <p class="cart__product-text">Скидка</p>
                            <span class="cart__product-price">6 147 ₽</span>
                        </div>
                        <div class="cart__totalprice">
                            <p class="cart__totalprice-title">Итоговая стоимость</p>
                            <span class="cart__totalprice-text">72 133 ₽</span>
                            <button class="cart__totalprice-button">Перейти к оформлению</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
